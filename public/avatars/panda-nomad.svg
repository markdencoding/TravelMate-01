<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-panda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Circle Backdrop -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-panda)"/>

  <!-- Panda Ears -->
  <circle cx="32" cy="34" r="14" fill="#0f172a"/>
  <circle cx="32" cy="34" r="6" fill="#334155"/>
  <circle cx="88" cy="34" r="14" fill="#0f172a"/>
  <circle cx="88" cy="34" r="6" fill="#334155"/>

  <!-- Head Base -->
  <circle cx="60" cy="64" r="36" fill="#ffffff"/>

  <!-- Eye Patches Behind Shades -->
  <ellipse cx="44" cy="58" rx="10" ry="12" fill="#0f172a" transform="rotate(-15 44 58)"/>
  <ellipse cx="76" cy="58" rx="10" ry="12" fill="#0f172a" transform="rotate(15 76 58)"/>

  <!-- Cool Traveler Sunglasses -->
  <!-- Left Lens -->
  <rect x="34" y="52" width="22" height="17" rx="6" fill="url(#lens)" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="37" y1="55" x2="44" y2="65" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <!-- Bridge -->
  <rect x="54" y="56" width="12" height="3" fill="#0f172a"/>
  <!-- Right Lens -->
  <rect x="64" y="52" width="22" height="17" rx="6" fill="url(#lens)" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="67" y1="55" x2="74" y2="65" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Snout / Nose -->
  <ellipse cx="60" cy="78" rx="8" ry="5.5" fill="#0f172a"/>
  <circle cx="58" cy="76" r="1.5" fill="#ffffff"/>
  <path d="M 56 86 Q 60 89 64 86" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cheeks -->
  <circle cx="34" cy="74" r="5" fill="#fbcfe8" opacity="0.7"/>
  <circle cx="86" cy="74" r="5" fill="#fbcfe8" opacity="0.7"/>

  <!-- Traveler Band / Collar -->
  <path d="M 40 96 Q 60 106 80 96 L 76 112 Q 60 116 44 112 Z" fill="#15803d"/>
  <circle cx="60" cy="103" r="3.5" fill="#facc15"/>
</svg>
