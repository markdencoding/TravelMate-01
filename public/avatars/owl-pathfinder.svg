<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-owl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="feather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <!-- Circle Backdrop -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-owl)"/>

  <!-- Ear Tufts / Horns -->
  <polygon points="34,42 22,22 46,32" fill="url(#feather)"/>
  <polygon points="86,42 98,22 74,32" fill="url(#feather)"/>

  <!-- Body / Head Base -->
  <ellipse cx="60" cy="66" rx="34" ry="32" fill="url(#feather)"/>

  <!-- Belly Feathers / Chest Plate -->
  <path d="M 44 74 C 44 94, 76 94, 76 74 Z" fill="#faf5ff"/>
  <path d="M 52 82 Q 60 86 68 82 M 54 88 Q 60 92 66 88" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Aviator Pilot Goggles on Forehead -->
  <rect x="36" y="38" width="48" height="4" fill="#312e81"/>
  <!-- Left Goggle Lens -->
  <circle cx="46" cy="40" r="9" fill="#38bdf8" stroke="#1e1b4b" stroke-width="2.5"/>
  <line x1="43" y1="36" x2="48" y2="44" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right Goggle Lens -->
  <circle cx="74" cy="40" r="9" fill="#38bdf8" stroke="#1e1b4b" stroke-width="2.5"/>
  <line x1="71" y1="36" x2="76" y2="44" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Big Curious Round Owl Eyes -->
  <circle cx="45" cy="62" r="13" fill="#ffffff"/>
  <circle cx="45" cy="62" r="8" fill="#f59e0b"/>
  <circle cx="45" cy="62" r="4.5" fill="#0f172a"/>
  <circle cx="43" cy="60" r="1.5" fill="#ffffff"/>

  <circle cx="75" cy="62" r="13" fill="#ffffff"/>
  <circle cx="75" cy="62" r="8" fill="#f59e0b"/>
  <circle cx="75" cy="62" r="4.5" fill="#0f172a"/>
  <circle cx="73" cy="60" r="1.5" fill="#ffffff"/>

  <!-- Beak -->
  <polygon points="56,66 64,66 60,76" fill="#ea580c"/>

  <!-- Rosy Cheeks -->
  <circle cx="33" cy="71" r="3.5" fill="#f472b6" opacity="0.6"/>
  <circle cx="87" cy="71" r="3.5" fill="#f472b6" opacity="0.6"/>

  <!-- Scout Compass Medallion -->
  <circle cx="60" cy="100" r="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="60,96 62,100 60,104 58,100" fill="#dc2626"/>
</svg>
