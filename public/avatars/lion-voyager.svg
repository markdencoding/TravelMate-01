  <circle cx="48" cy="62" r="3.5" fill="#451a03"/>
  <circle cx="47" cy="61" r="1.2" fill="#ffffff"/>
  <circle cx="72" cy="62" r="3.5" fill="#451a03"/>
  <circle cx="71" cy="61" r="1.2" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="42" cy="72" r="3" fill="#f87171" opacity="0.5"/>
  <circle cx="78" cy="72" r="3" fill="#f87171" opacity="0.5"/>
