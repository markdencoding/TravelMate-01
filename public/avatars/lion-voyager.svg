    <circle cx="60" cy="64" r="44"/>
    <circle cx="32" cy="46" r="12"/>
    <circle cx="88" cy="46" r="12"/>
    <circle cx="24" cy="64" r="13"/>
    <circle cx="96" cy="64" r="13"/>
    <circle cx="30" cy="84" r="12"/>
    <circle cx="90" cy="84" r="12"/>
    <circle cx="46" cy="98" r="12"/>
    <circle cx="74" cy="98" r="12"/>
  </g>

  <!-- Ears -->
  <circle cx="38" cy="38" r="10" fill="#f59e0b"/>
  <circle cx="38" cy="38" r="5" fill="#fef3c7"/>
  <circle cx="82" cy="38" r="10" fill="#f59e0b"/>
  <circle cx="82" cy="38" r="5" fill="#fef3c7"/>

  <!-- Face Base -->
