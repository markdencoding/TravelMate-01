<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-koala" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="fur-koala" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Circle Backdrop -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-koala)"/>

  <!-- Big Fuzzy Ears -->
  <circle cx="28" cy="44" r="18" fill="url(#fur-koala)"/>
  <circle cx="28" cy="44" r="11" fill="#f1f5f9"/>
  <circle cx="92" cy="44" r="18" fill="url(#fur-koala)"/>
  <circle cx="92" cy="44" r="11" fill="#f1f5f9"/>

  <!-- Head Base -->
  <ellipse cx="60" cy="65" rx="34" ry="30" fill="url(#fur-koala)"/>

  <!-- White Fluffy Inner Cheeks -->
  <ellipse cx="44" cy="74" rx="9" ry="7" fill="#f1f5f9"/>
  <ellipse cx="76" cy="74" rx="9" ry="7" fill="#f1f5f9"/>

  <!-- Iconic Large Oval Koala Nose -->
  <ellipse cx="60" cy="67" rx="10" ry="15" fill="#1e293b"/>
  <ellipse cx="58" cy="62" rx="3" ry="5" fill="#475569"/>

  <!-- Friendly Eyes -->
  <circle cx="44" cy="56" r="4" fill="#0f172a"/>
  <circle cx="43" cy="55" r="1.5" fill="#ffffff"/>
  <circle cx="76" cy="56" r="4" fill="#0f172a"/>
  <circle cx="75" cy="55" r="1.5" fill="#ffffff"/>

  <!-- Smile -->
  <path d="M 54 84 Q 60 88 66 84" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cheeks -->
  <circle cx="36" cy="66" r="4" fill="#fbcfe8" opacity="0.6"/>
  <circle cx="84" cy="66" r="4" fill="#fbcfe8" opacity="0.6"/>

  <!-- Yellow Explorer Neckerchief / Bandana -->
  <path d="M 42 90 Q 60 98 78 90 L 60 114 Z" fill="#eab308"/>
  <circle cx="60" cy="95" r="3" fill="#ca8a04"/>
  <!-- Knot tails -->
  <polygon points="58,97 53,107 58,103" fill="#ca8a04"/>
  <polygon points="62,97 67,107 62,103" fill="#ca8a04"/>
</svg>
