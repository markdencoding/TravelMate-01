<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-penguin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="body-pen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Circle Backdrop -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-penguin)"/>

  <!-- Penguin Head / Body Base -->
  <ellipse cx="60" cy="68" rx="34" ry="32" fill="url(#body-pen)"/>

  <!-- White Face & Belly Mask -->
  <path d="M 40 54 C 40 48, 52 48, 56 56 C 58 60, 62 60, 64 56 C 68 48, 80 48, 80 54 C 80 84, 40 84, 40 54 Z" fill="#ffffff"/>
  <ellipse cx="60" cy="80" rx="18" ry="18" fill="#ffffff"/>

  <!-- Sailor Navigator Hat -->
  <ellipse cx="60" cy="38" rx="24" ry="7" fill="#1e3a8a"/>
  <path d="M 44 38 C 44 26, 76 26, 76 38 Z" fill="#ffffff"/>
  <circle cx="60" cy="32" r="3" fill="#fbbf24"/>
  <!-- Gold anchor icon on cap -->
  <path d="M 60 29 L 60 35 M 57 32 Q 60 36 63 32" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="48" cy="60" r="4" fill="#0f172a"/>
  <circle cx="47" cy="59" r="1.3" fill="#ffffff"/>
  <circle cx="72" cy="60" r="4" fill="#0f172a"/>
  <circle cx="71" cy="59" r="1.3" fill="#ffffff"/>

  <!-- Beak -->
  <polygon points="53,68 67,68 60,78" fill="#f97316"/>
  <polygon points="55,68 65,68 60,71" fill="#ea580c"/>

  <!-- Rosy Cheeks -->
  <circle cx="39" cy="68" r="4" fill="#fda4af" opacity="0.7"/>
  <circle cx="81" cy="68" r="4" fill="#fda4af" opacity="0.7"/>

  <!-- Sailor Ascot Scarf -->
  <path d="M 44 92 Q 60 100 76 92 L 68 112 Q 60 114 52 112 Z" fill="#dc2626"/>
  <circle cx="60" cy="98" r="3" fill="#ffffff"/>
</svg>
