<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="fur-fox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Circle Backdrop -->
  <circle cx="60" cy="60" r="56" fill="url(#bg-fox)"/>
  
  <!-- Outer Ears -->
  <polygon points="30,52 24,18 52,38" fill="url(#fur-fox)"/>
  <polygon points="90,52 96,18 68,38" fill="url(#fur-fox)"/>
  <!-- Inner Ears -->
  <polygon points="32,48 28,24 48,38" fill="#ffedd5"/>
  <polygon points="88,48 92,24 72,38" fill="#ffedd5"/>
  <polygon points="32,46 29,26 44,38" fill="#1e293b"/>

  <!-- Head Base -->
  <path d="M 28 62 C 28 42, 92 42, 92 62 C 92 84, 60 98, 60 98 C 60 98, 28 84, 28 62 Z" fill="url(#fur-fox)"/>
  
  <!-- White Cheeks & Muzzle -->
  <path d="M 28 64 C 40 70, 48 88, 60 98 C 72 88, 80 70, 92 64 C 92 82, 74 96, 60 98 C 46 96, 28 82, 28 64 Z" fill="#ffffff"/>
  <path d="M 46 72 Q 60 84 74 72 Q 60 96 46 72 Z" fill="#ffffff"/>

  <!-- Eyes -->
  <circle cx="45" cy="58" r="5" fill="#0f172a"/>
  <circle cx="43.5" cy="56.5" r="1.8" fill="#ffffff"/>
  <circle cx="75" cy="58" r="5" fill="#0f172a"/>
  <circle cx="73.5" cy="56.5" r="1.8" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 55 82 Q 60 79 65 82 Q 60 88 55 82 Z" fill="#0f172a"/>

  <!-- Traveler Bandana / Scarf -->
  <path d="M 38 92 Q 60 102 82 92 L 60 114 Z" fill="#0d9488"/>
  <circle cx="60" cy="98" r="3" fill="#fef08a"/>
</svg>
